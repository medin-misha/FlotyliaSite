services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    # НЕТ ports: — доступ только через nginx
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_DEFAULT_BUCKET};
      "
    networks:
      - backend-net
    restart: on-failure

  backend:
    build:
      context: ./backend
    env_file:
      - backend/app/.env
    networks:
      - backend-net
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build:
      context: ./frontend
    networks:
      - frontend-net
    restart: always

  admin:
    build:
      context: ./admin-vue
      args:
        VITE_API_URL: /api/v1
        VITE_HTTPS_ONLY: "true"
    networks:
      - frontend-net
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - admin
      - backend
    networks:
      - frontend-net
      - backend-net
    restart: always

networks:
  backend-net:
    driver: bridge
    internal: false
  frontend-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data: