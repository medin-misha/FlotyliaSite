services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # НЕТ блока ports: — база недоступна снаружи!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: minio
    # НЕТ ports: — доступ только через nginx
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
    restart: always

  frontend:
    build:
      context: ./frontend
    networks:
      - frontend-net
    restart: always

  admin:
    build:
      context: ./admin-vue
      args:
        VITE_API_URL: /api/v1
        VITE_HTTPS_ONLY: "true"
    networks:
      - frontend-net
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - admin
      - backend
    networks:
      - frontend-net
      - backend-net
    restart: always

networks:
  backend-net:
    driver: bridge
    internal: false
  frontend-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data: